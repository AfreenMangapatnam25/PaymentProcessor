spring:
  application:
    name: limit-service
  datasource:
    url: jdbc:postgresql://db-prod.internal:5432/limit_prod
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: redis-prod.internal
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

server:
  port: 8085
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12

eureka:
  client:
    service-url:
      defaultZone: http://eureka-prod.internal:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: limit-service-prod
    prefer-ip-address: false

limit:
  daily-transaction-limit: 50000.00
  monthly-transaction-limit: 500000.00
  per-transaction-limit: 100000.00
  velocity-window-minutes: 60
  velocity-max-transactions: 100

logging:
  level:
    root: WARN
    com.paymentprocessor: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
