spring:
  application:
    name: limit-service
  datasource:
    url: jdbc:postgresql://localhost:5432/limitservicedb
    username: postgres
    password: Mysql@2022
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8085

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

limit:
  daily-transaction-limit: 10000.00
  monthly-transaction-limit: 100000.00
  per-transaction-limit: 50000.00
  velocity-window-minutes: 60
  velocity-max-transactions: 20

logging:
  level:
    root: INFO
    com.paymentprocessor: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
