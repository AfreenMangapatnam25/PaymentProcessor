spring:
  application:
    name: limit-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1500
        multiplier: 1.5
        max-interval: 3000
  datasource:
    url: jdbc:postgresql://localhost:5432/limitservicedb
    username: postgres
    password: Mysql@2022
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  # OAuth2 resource server. Access tokens are minted by authentication-service
  # (social / password login) and signed RS256; we verify them locally against its
  # published JWK set, so no network call to the auth service is needed per request.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://auth.paymentprocessor.local}
  profiles:
    active:
      - local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost

limit:
  daily-transaction-limit: 10000.00
  monthly-transaction-limit: 100000.00
  per-transaction-limit: 50000.00
  velocity-window-minutes: 60
  velocity-max-transactions: 20
  # How long a reservation is held before the sweeper auto-releases it.
  reservation-ttl-minutes: 15
  # Kafka topics for published domain events.
  events:
    reserved-topic: ${LIMIT_EVENTS_TOPIC:limitservicetopic}
    released-topic: ${LIMIT_EVENTS_TOPIC:limitservicetopic}
    exceeded-topic: ${LIMIT_EVENTS_TOPIC:limitservicetopic}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.paymentprocessor: DEBUG

# Toggle: lets local/dev runs and the seeded sample data be exercised without a token.
security:
  jwt:
    enabled: ${SECURITY_JWT_ENABLED:true}

---
# Local/dev profile document: layer the sample-data seed migration (db/seed) on
# top of the base schema/reference-data migrations (db/migration) so local
# Postgres environments get deterministic sample limit configs/usage to test against.
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed

# Local/dev runs are exercised against seeded sample data with plain curl, so the
# JWT resource-server chain is swapped for a permit-all chain here (never in prod).
security:
  jwt:
    enabled: false
