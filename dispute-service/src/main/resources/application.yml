spring:
  application:
    name: dispute-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dispute_db}
    username: ${DB_USERNAME:dispute_service}
    password: ${DB_PASSWORD:dispute_service}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8090}

# ---------------------------------------------------------------------------
# Downstream service base URLs (used by the WebClient-backed integration
# clients in integration/web).
# ---------------------------------------------------------------------------
payment:
  service:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8087}

ledger:
  service:
    base-url: ${LEDGER_SERVICE_URL:http://localhost:8092}

settlement:
  service:
    base-url: ${SETTLEMENT_SERVICE_URL:http://localhost:8091}

notification:
  service:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8094}

# ---------------------------------------------------------------------------
# Deadline monitor (see DeadlineMonitorJob)
# ---------------------------------------------------------------------------
dispute:
  deadline:
    sweep-interval-ms: 3600000
    sweep-initial-delay-ms: 60000