spring:
  application:
    name: dispute-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1500
        multiplier: 1.5
        max-interval: 3000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:disputeservicedb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Mysql@2022}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # OAuth2 resource-server settings. Tokens are verified offline against the
  # authentication service's published JWK set, so no network call to the auth
  # service is needed per request.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://auth.paymentprocessor.local}
  profiles:
    active:
      - local

server:
  port: ${SERVER_PORT:8090}

# ---------------------------------------------------------------------------
# Downstream service base URLs (used by the WebClient-backed integration
# clients in integration/web).
# ---------------------------------------------------------------------------
payment:
  service:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8087}

ledger:
  service:
    base-url: ${LEDGER_SERVICE_URL:http://localhost:8092}

settlement:
  service:
    base-url: ${SETTLEMENT_SERVICE_URL:http://localhost:8091}

notification:
  service:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8094}

# ---------------------------------------------------------------------------
# Deadline monitor (see DeadlineMonitorJob)
# ---------------------------------------------------------------------------
dispute:
  deadline:
    sweep-interval-ms: 3600000
    sweep-initial-delay-ms: 60000

# Toggle: lets local/dev runs and the seeded sample data be exercised without a token.
security:
  jwt:
    enabled: ${SECURITY_JWT_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed

# Local/dev runs are exercised against seeded sample data with plain curl, so the
# JWT resource-server chain is swapped for a permit-all chain here (never in prod).
security:
  jwt:
    enabled: false
