# ============================================================================
# Base configuration (shared by all profiles). Profile files override per-env.
# Default active profile is "local" unless SPRING_PROFILES_ACTIVE is set.
# ============================================================================
spring:
  application:
    name: authorization-service
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://localhost:5432/authorization_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8086
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: true

# ----------------------------------------------------------------------------
# Authorization behaviour
# ----------------------------------------------------------------------------
authorization:
  timeout-seconds: 30
  retry-attempts: 3
  avs-required: true
  three-ds-enabled: true
  default-hold-minutes: 10080      # 7 days
  max-reauthorizations: 3
  default-currency: USD

# ----------------------------------------------------------------------------
# External payment gateway
# ----------------------------------------------------------------------------
gateway:
  provider: stripe
  stripe:
    api-key: ${STRIPE_API_KEY:}
    connect-timeout-ms: 10000
    read-timeout-ms: 30000
    max-network-retries: 2

# ----------------------------------------------------------------------------
# Identity token validation (tokens issued by the Authentication Service)
# ----------------------------------------------------------------------------
security:
  jwt:
    verify-signature: true
    hmac-secret: ${JWT_HMAC_SECRET:}
    public-key: ${JWT_PUBLIC_KEY:}
    issuer: ${JWT_ISSUER:}
    roles-claim: roles
    scope-claim: scope
    merchant-claim: merchant_id

# ----------------------------------------------------------------------------
# Resilience (applied to gateway calls)
# ----------------------------------------------------------------------------
resilience4j:
  retry:
    instances:
      gateway:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.paymentprocessor.authorization.gateway.GatewayException
  circuitbreaker:
    instances:
      gateway:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    instances:
      gateway:
        timeout-duration: 30s

# ----------------------------------------------------------------------------
# Observability
# ----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: authorization-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.paymentprocessor: DEBUG
