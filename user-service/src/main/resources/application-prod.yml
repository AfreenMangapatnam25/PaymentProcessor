# Production. Everything secret comes from the environment / secret manager.
# No SQL logging, no Swagger UI, Flyway clean hard-disabled, larger pool.
spring:
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}

server:
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.paymentprocessor.userservice: INFO
    org.springframework.security: WARN

app:
  crypto:
    kms:
      provider: ${KMS_PROVIDER:aws-kms}
