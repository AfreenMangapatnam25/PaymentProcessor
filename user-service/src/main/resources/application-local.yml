# Local workstation profile (docker-compose Postgres/Kafka). Developer-friendly:
# verbose SQL, permissive Swagger, local KMS stub. NEVER used outside a laptop.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false
    # Local-only seed data (V8__seed_sample_data.sql) lives in a separate
    # classpath root so it can never be picked up by dev/prod, which only
    # scan classpath:db/migration (see base application.yml).
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    com.paymentprocessor.userservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO

app:
  crypto:
    kms:
      provider: local
