# Local workstation profile (docker-compose Postgres/Kafka). Developer-friendly:
# verbose SQL, permissive Swagger, local KMS stub. NEVER used outside a laptop.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false

logging:
  level:
    com.paymentprocessor.userservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO

app:
  crypto:
    kms:
      provider: local
