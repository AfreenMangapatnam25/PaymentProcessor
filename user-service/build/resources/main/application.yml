# =============================================================================
# user-service :: base configuration
# -----------------------------------------------------------------------------
# Only environment-agnostic defaults live here. Every secret and endpoint is
# supplied via environment variables (12-factor) so the same artifact runs in
# every environment. Profile files (-local/-dev/-prod) override where needed.
# =============================================================================
spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1500
        multiplier: 1.5
        max-interval: 3000
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/userservicedb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Mysql@2022}
    hikari:
      # Pool sized per-instance; horizontal scale multiplies this. Keep it small
      # so N replicas do not exhaust Postgres max_connections.
      pool-name: user-service-cp
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      max-lifetime: 1800000
      idle-timeout: 600000
      # Fail fast on startup if the DB is unreachable in prod-like environments.
      initialization-fail-timeout: 10000

  jpa:
    # Flyway owns the schema. Hibernate must never mutate DDL.
    hibernate:
      ddl-auto: none
    # open-session-in-view leaks the persistence context into controllers and
    # hides N+1s; always off in a service that maps to DTOs at the boundary.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          # Both keys are read by our OWN JwtDecoder bean in SecurityConfig, not by Boot's
          # auto-configuration.
          #
          # Do NOT reintroduce a blank default here (e.g. jwk-set-uri: ${VAR:}). An empty
          # value still counts as "property present" for @ConditionalOnProperty, so Boot
          # built BOTH jwtDecoderByJwkKeySetUri and jwtDecoderByIssuerUri and startup failed
          # with "required a single bean, but 2 were found". Declaring an explicit JwtDecoder
          # bean suppresses both (they are @ConditionalOnMissingBean) and removes the
          # ambiguity for good.
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://auth.paymentprocessor.local}

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: user-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

# -----------------------------------------------------------------------------
# Application-specific configuration (bound to typed @ConfigurationProperties).
# -----------------------------------------------------------------------------
app:
  security:
    # JWT claim names issued by authentication-service.
    jwt:
      authorities-claim: scope
      authorities-prefix: "SCOPE_"
      merchant-id-claim: merchant_id
      identity-id-claim: sub
  crypto:
    # Envelope encryption. The master (KEK) never leaves the KMS/HSM; only
    # per-subject DEKs are stored (wrapped) in crypto_keys. Crypto-shredding
    # destroys the DEK, rendering that subject's ciphertext unrecoverable.
    kms:
      provider: ${KMS_PROVIDER:local}
      master-key-id: ${KMS_MASTER_KEY_ID:local-dev-master-key}
    data-key:
      algorithm: AES
      key-size-bits: 256
      cipher-transformation: "AES/GCM/NoPadding"
      gcm-tag-length-bits: 128
    # Deterministic HMAC used to build blind indexes so encrypted columns
    # (e.g. email) remain uniquely searchable without storing plaintext.
    blind-index:
      hmac-algorithm: HmacSHA256
      key-id: ${BLIND_INDEX_KEY_ID:local-dev-blind-index-key}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
      batch-size: ${OUTBOX_BATCH_SIZE:100}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
