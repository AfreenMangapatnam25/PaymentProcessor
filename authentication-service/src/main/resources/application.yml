spring:
  application:
    name: authentication-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1500
        multiplier: 1.5
        max-interval: 3000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authenticationservicedb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Mysql@2022}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never mutates or validates it in prod.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        spring.json.add.type.headers: true
  profiles:
    active:
      - local

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

auth:
  # ---------------------------------------------------------------------------
  # Social login ("Login with Google/GitHub/Microsoft").
  #
  # Each provider is OPTIONAL: leaving client-id blank means that provider is not
  # registered at all, and the service starts normally with password login only.
  # Supply real credentials via environment variables - never commit them here.
  #
  # Register this redirect URI with each provider's developer console:
  #   http://localhost:8081/login/oauth2/code/{google|github|microsoft}
  # ---------------------------------------------------------------------------
  social:
    # Where the browser is sent after a successful social login, with tokens
    # attached as query params. Leave BLANK to have the tokens returned as a JSON
    # response body instead - which is what makes the flow testable with curl.
    redirect-uri: ${SOCIAL_REDIRECT_URI:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    microsoft:
      client-id: ${MICROSOFT_CLIENT_ID:}
      client-secret: ${MICROSOFT_CLIENT_SECRET:}
      # Azure AD tenant. "common" accepts personal + any organisational account;
      # set a tenant GUID to restrict logins to a single organisation.
      tenant: ${MICROSOFT_TENANT:common}

  jwt:
    issuer: ${JWT_ISSUER:https://auth.paymentprocessor.local}
    audience: ${JWT_AUDIENCE:payment-platform}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    # PEM strings supplied from a secrets manager. This is the production path.
    private-key-pem: ${JWT_PRIVATE_KEY:}
    public-key-pem: ${JWT_PUBLIC_KEY:}
    key-id: ${JWT_KEY_ID:}
    # Fallback when no PEM is configured: the generated keypair is persisted here and
    # reloaded on restart, so already-issued tokens keep validating across a bounce.
    # A file on the app host is a dev convenience, not a secrets store — use the PEMs
    # above in production.
    key-store-path: ${JWT_KEY_STORE_PATH:.local-keys/jwt-signing-key.json}
  refresh:
    ttl: ${REFRESH_TTL:P30D}
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    poll-interval-ms: ${OUTBOX_POLL_MS:2000}
  lockout:
    max-failed-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}
    window: ${LOCKOUT_WINDOW:PT15M}
    lock-duration: ${LOCKOUT_DURATION:PT15M}
  ratelimit:
    login-attempts-per-minute: ${RL_LOGIN_PER_MIN:10}
    reset-requests-per-hour: ${RL_RESET_PER_HOUR:5}
  password:
    min-length: 12
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special: true
    history-depth: 5
    max-age: ${PASSWORD_MAX_AGE:P180D}
  mfa:
    issuer-label: ${MFA_ISSUER_LABEL:PaymentProcessor}
    totp-step-seconds: 30
    totp-window: 1
    recovery-code-count: 10
  verification:
    token-ttl: ${VERIFICATION_TTL:PT30M}
  reset:
    token-ttl: ${RESET_TTL:PT30M}
  events:
    topics:
      user-logged-in: ${TOPIC_LOGIN:auth.user.logged-in}
      user-logged-out: ${TOPIC_LOGOUT:auth.user.logged-out}
      password-changed: ${TOPIC_PWD:auth.password.changed}
      mfa-enabled: ${TOPIC_MFA:auth.mfa.enabled}
      account-locked: ${TOPIC_LOCK:auth.account.locked}
      new-device: ${TOPIC_DEVICE:auth.device.new-login}

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed
