spring:
  datasource:
    url: jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.block.ms: 1000

auth:
  jwt:
    issuer: https://auth.test.local
    audience: payment-platform-test
    private-key-pem: ""
    public-key-pem: ""
  outbox:
    relay-enabled: false
