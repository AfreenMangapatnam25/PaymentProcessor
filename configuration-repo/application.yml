# Shared observability defaults for every service (Config Server).
# Apps still keep a local copy in application.yml so bootRun works without Config Server.
#
# Pipeline:
#   Metrics  → Micrometer → /actuator/prometheus → Prometheus scrape
#   Traces   → Micrometer Tracing → OTel bridge → OTLP → Collector → Tempo
#   Logs     → JSON stdout + logs/<service>.json.log → Alloy → Loki

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Single export target — change Collector routing without touching services.
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}]"
