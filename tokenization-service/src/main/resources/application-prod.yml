spring:
  application:
    name: tokenization-service
  datasource:
    url: jdbc:postgresql://db-prod.internal:5432/tokenization_prod
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8084
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12

eureka:
  client:
    service-url:
      defaultZone: http://eureka-prod.internal:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: tokenization-service-prod
    prefer-ip-address: false

tokenization:
  encryption:
    algorithm: AES/GCM/NoPadding
    key-size: 256
    hsm-enabled: true
  vault:
    retention-days: 2555
  audit:
    enabled: true

logging:
  level:
    root: WARN
    com.paymentprocessor: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
