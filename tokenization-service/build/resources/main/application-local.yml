spring:
  application:
    name: tokenization-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tokenization_local
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8084

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

tokenization:
  encryption:
    algorithm: AES/GCM/NoPadding
    key-size: 256
  vault:
    retention-days: 30
  audit:
    enabled: true

logging:
  level:
    root: INFO
    com.paymentprocessor: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
