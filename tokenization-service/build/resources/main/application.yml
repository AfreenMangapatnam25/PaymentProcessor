spring:
  application:
    name: tokenization-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1500
        multiplier: 1.5
        max-interval: 3000
  datasource:
    url: jdbc:postgresql://localhost:5432/tokenizationservicedb
    username: postgres
    password: Mysql@2022
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # WORKAROUND: this service ships with no Flyway migrations at all (no db/migration dir),
      # so with ddl-auto=validate it cannot start against an empty database - there is no schema
      # for Hibernate to validate against. Using "update" lets Hibernate create/evolve the schema
      # from the @Entity classes so local/dev startup works. This is NOT a substitute for real
      # schema management (Flyway/Liquibase) and should not be relied on for production.
      ddl-auto: update
    show-sql: false
    # Required so data.sql runs AFTER Hibernate has created the tables (ddl-auto: update above),
    # otherwise Spring runs data.sql before the schema exists and inserts fail.
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  # OAuth2 resource server. This service holds card data, so every caller (normally
  # payment-service, service-to-service) must present an RS256 JWT minted by
  # authentication-service. Keys come from its JWKS document; issuer-uri pins `iss`.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://auth.paymentprocessor.local}

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost

tokenization:
  encryption:
    algorithm: AES/GCM/NoPadding
    key-size: 256
  vault:
    retention-days: 2555
  audit:
    enabled: true

# Toggle: lets local/dev runs and the seeded sample data be exercised without a token.
security:
  jwt:
    enabled: ${SECURITY_JWT_ENABLED:true}

logging:
  level:
    root: INFO
    com.paymentprocessor: DEBUG

---
# --------------------------------------------------------------------------
# local profile: developer laptops only. JWT validation is switched off so the
# CRUD controllers and the seeded data.sql rows can be exercised without running
# authentication-service. Note this service also has application-local.yml; both
# documents are merged when the `local` profile is active.
# --------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: local

security:
  jwt:
    enabled: false
