spring:
  application:
    name: tokenization-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tokenization_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost

tokenization:
  encryption:
    algorithm: AES/GCM/NoPadding
    key-size: 256
  vault:
    retention-days: 2555
  audit:
    enabled: true

logging:
  level:
    root: INFO
    com.paymentprocessor: DEBUG
