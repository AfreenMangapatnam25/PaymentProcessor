spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  # --- Redis: backing store for token-bucket rate limits (ephemeral) ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2

  # --- Resource server: validate short-lived JWTs locally against a cached JWKS ---
  # The Nimbus decoder fetches the JWK set once and caches it; the auth-service is
  # NOT called on the hot path.
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are fetched from authentication-service's published JWK set.
          #
          # issuer-uri is deliberately NOT set here. A blank default (${VAR:}) still counts as
          # "property present" for @ConditionalOnProperty, which makes Spring Boot publish BOTH
          # a jwk-set-uri decoder and an issuer-uri decoder - two beans where one is required,
          # failing startup with "required a single bean, but 2 were found".
          #
          # The gateway therefore verifies the SIGNATURE and expiry only. Issuer and the
          # purpose=access claim are enforced by each downstream service's own JwtDecoder, so a
          # token that bypasses the gateway is still fully validated. To have the gateway check
          # the issuer too, set issuer-uri to a REAL value (never blank) - Boot then publishes
          # only the issuer-based decoder.
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1500
        multiplier: 1.5
        max-interval: 3000
    gateway:
      # Discard duplicated response headers introduced by downstream services.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        # Never let a client spoof identity/trace headers we set ourselves.
        - RemoveRequestHeader=X-User-Id
        - RemoveRequestHeader=X-User-Roles
        - RemoveRequestHeader=X-Merchant-Id

      httpclient:
        connect-timeout: 2000            # ms to establish a downstream TCP connection
        response-timeout: 8s             # global ceiling on a downstream response
        pool:
          max-connections: 500
          acquire-timeout: 5000

      # Global CORS — a single public surface for browser clients.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:https://*.paymentprocessor.com}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: '*'
            allowCredentials: true
            maxAge: 3600

      routes:
        # ---------------- Payment service ----------------
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8080}
          predicates:
            - Path=/api/v1/payments/**,/api/v1/charges/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@apiKeyResolver}"
                redis-rate-limiter.replenishRate: ${PAYMENT_RL_RATE:50}
                redis-rate-limiter.burstCapacity: ${PAYMENT_RL_BURST:100}
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/fallback/payment-service
            - name: Retry
              args:
                retries: 2
                methods: GET
                series: SERVER_ERROR
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2

        # ---------------- Refund service ----------------
        - id: refund-service
          uri: ${REFUND_SERVICE_URI:http://refund-service:8080}
          predicates:
            - Path=/api/v1/refunds/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@apiKeyResolver}"
                redis-rate-limiter.replenishRate: ${REFUND_RL_RATE:20}
                redis-rate-limiter.burstCapacity: ${REFUND_RL_BURST:40}
            - name: CircuitBreaker
              args:
                name: refundCircuitBreaker
                fallbackUri: forward:/fallback/refund-service

        # ---------------- Merchant service ----------------
        - id: merchant-service
          uri: ${MERCHANT_SERVICE_URI:http://merchant-service:8080}
          predicates:
            - Path=/api/v1/merchants/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@apiKeyResolver}"
                redis-rate-limiter.replenishRate: ${MERCHANT_RL_RATE:30}
                redis-rate-limiter.burstCapacity: ${MERCHANT_RL_BURST:60}
            - name: CircuitBreaker
              args:
                name: merchantCircuitBreaker
                fallbackUri: forward:/fallback/merchant-service

        # ---------------- User service ----------------
        - id: user-service
          uri: ${USER_SERVICE_URI:http://user-service:8080}
          predicates:
            - Path=/api/v1/users/**,/api/v1/customers/**,/api/v1/addresses/**,/api/v1/consents/**
          filters:
            - name: RequestRateLimiter
              args:
