        # ---------------- Authentication service ----------------
        - id: authentication-service
          uri: ${AUTHENTICATION_SERVICE_URI:http://authentication-service:8080}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/mfa/**,/api/v1/passwords/**,/api/v1/devices/**,/api/v1/api-keys/**,/api/v1/verification/**,/api/v1/admin/identities/**
