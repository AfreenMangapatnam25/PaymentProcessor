# --- Server / TLS termination ---
server:
  port: ${SERVER_PORT:8443}
  # TLS is enabled only when a keystore is supplied (prod). Locally, omit the env
  # vars and the gateway serves plain HTTP so you can run without certs.
  ssl:
    enabled: ${TLS_ENABLED:false}
    key-store: ${TLS_KEYSTORE:}
    key-store-password: ${TLS_KEYSTORE_PASSWORD:}
    key-store-type: ${TLS_KEYSTORE_TYPE:PKCS12}
    # Enforce modern transport security.
    enabled-protocols: TLSv1.3,TLSv1.2
  # Cap request line + header size to blunt oversized-header attacks.
  max-http-request-header-size: 16KB
  netty:
    # Reject absurd request bodies early; per-route overrides via RequestSize filter.
    max-initial-line-length: 8KB
  forward-headers-strategy: framework

# --- Resilience4j circuit breaker + time limiter defaults ---
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 5s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      paymentCircuitBreaker:
        baseConfig: default
      refundCircuitBreaker:
        baseConfig: default
      merchantCircuitBreaker:
        baseConfig: default
      userCircuitBreaker:
        baseConfig: default
      authenticationCircuitBreaker:
        baseConfig: default
      tokenizationCircuitBreaker:
        baseConfig: default
      limitCircuitBreaker:
        baseConfig: default
      authorizationCircuitBreaker:
        baseConfig: default
      fraudCircuitBreaker:
        baseConfig: default
      clearingCircuitBreaker:
        baseConfig: default
      disputeCircuitBreaker:
        baseConfig: default
      settlementCircuitBreaker:
        baseConfig: default
      ledgerCircuitBreaker:
        baseConfig: default
      reconciliationCircuitBreaker:
        baseConfig: default
      notificationCircuitBreaker:
        baseConfig: default
      auditCircuitBreaker:
        baseConfig: default
      reportingCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 8s
        cancelRunningFuture: true
    instances:
      paymentCircuitBreaker: { baseConfig: default }
      refundCircuitBreaker: { baseConfig: default }
      merchantCircuitBreaker: { baseConfig: default }
      userCircuitBreaker: { baseConfig: default }
      authenticationCircuitBreaker: { baseConfig: default }
      tokenizationCircuitBreaker: { baseConfig: default }
      limitCircuitBreaker: { baseConfig: default }
      authorizationCircuitBreaker: { baseConfig: default }
      fraudCircuitBreaker: { baseConfig: default }
      clearingCircuitBreaker: { baseConfig: default }
      disputeCircuitBreaker: { baseConfig: default }
      settlementCircuitBreaker: { baseConfig: default }
      ledgerCircuitBreaker: { baseConfig: default }
      reconciliationCircuitBreaker: { baseConfig: default }
      notificationCircuitBreaker: { baseConfig: default }
      auditCircuitBreaker: { baseConfig: default }
      reportingCircuitBreaker: { baseConfig: default }

# --- Gateway-specific tunables (bound in GatewayProperties) ---
gateway:
  # Reject request bodies larger than this before proxying (bytes). 1 MiB default.
  max-request-body-bytes: ${MAX_REQUEST_BODY_BYTES:1048576}
  # Endpoints that skip JWT auth (health, docs, the auth handshake itself).
  public-paths:
    - /actuator/health/**
    - /actuator/info
    - /fallback/**
    - /api/gateway/health
  audit:
    enabled: ${AUDIT_ENABLED:true}
    uri: ${AUDIT_SERVICE_URI:http://audit-service:8080}
    path: ${AUDIT_SERVICE_PATH:/api/v1/audit/events}
  apikey:
    header-name: ${API_KEY_HEADER:X-API-Key}

# --- Observability ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, gateway
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    # Surface trace + correlation ids in every log line for cross-service debugging.
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.paymentprocessor.gatewayservice: INFO
    reactor.netty: WARN
