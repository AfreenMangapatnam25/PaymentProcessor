# ==========================================================================
# Settlement Service configuration
#
# Profiles:
#   dev  (default) -> in-memory H2 database, JPA creates schema, simulated rails
#   prod           -> PostgreSQL, Flyway migrations, stricter settings
# ==========================================================================

server:
  port: ${SERVER_PORT:8091}
  shutdown: graceful

spring:
  application:
    name: settlement-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1500
        multiplier: 1.5
        max-interval: 3000
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # OAuth2 resource server. authentication-service (port 8081) signs access tokens with
  # RS256; we validate them against its JWKS document and pin the expected issuer.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://auth.paymentprocessor.local}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Toggle: lets local/dev runs and the seeded sample data be exercised without a token.
security:
  jwt:
    enabled: ${SECURITY_JWT_ENABLED:true}

# --------------------------------------------------------------------------
# Settlement domain configuration. All monetary values are in MINOR units
# (e.g. cents) unless otherwise stated.
# --------------------------------------------------------------------------
settlement:
  # Minimum net payout (minor units) before a batch is released. Below this,
  # funds roll over to the next cycle.
  minimum-payout-minor: 2500
  # Rolling reserve default hold period, in days.
  reserve-hold-days: 90
  retry:
    max-attempts: 5
    # Exponential backoff between attempts, in minutes: 1h, 4h, 12h, 24h, 48h
    backoff-minutes: [60, 240, 720, 1440, 2880]
  approval:
    # Adjustments above this (minor units) require supervisor approval.
    supervisor-threshold-minor: 100000
    # Adjustments above this (minor units) require finance-director approval.
    finance-director-threshold-minor: 1000000
    # Reversals above this (minor units) require finance-director approval.
    reversal-finance-director-threshold-minor: 500000
  scheduler:
    # Cron for the main settlement cycle run (default: every business hour).
    cycle-cron: "0 0 * * * *"
    # Cron for the retry sweep.
    retry-cron: "0 */15 * * * *"
    # Cron for reserve release sweep (default: daily 02:00 UTC).
    reserve-release-cron: "0 0 2 * * *"
    enabled: true
  integration:
    ledger:
      base-url: ${LEDGER_SERVICE_URL:http://localhost:8092}
      timeout-ms: ${LEDGER_SERVICE_TIMEOUT_MS:5000}
    merchant:
      base-url: ${MERCHANT_SERVICE_URL:http://localhost:8083}
      timeout-ms: ${MERCHANT_SERVICE_TIMEOUT_MS:3000}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:settlement;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    # Hibernate creates the schema on startup (ddl-auto: update); defer data.sql
    # until after that so the seed inserts below don't race the DDL.
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

# dev profile only (H2, default active): no bearer token required, so the H2 console
# and the seeded settlement batches can be poked at without authentication-service
# running. The prod document below deliberately does NOT override this, so prod keeps
# the default of true and requires a valid JWT.
security:
  jwt:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settlementservicedb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Mysql@2022}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
