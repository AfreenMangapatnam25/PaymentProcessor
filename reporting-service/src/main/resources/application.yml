spring:
  application:
    name: analytics
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1500
        multiplier: 1.5
        max-interval: 3000
  # ---- Postgres: operational job-metadata store (this service DOES own this) ----
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/reportingservicedb}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:Mysql@2022}
    hikari:
      pool-name: analytics-jobs
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Skip Flyway for ClickHouse (read-only OLAP replica)
    # Only run migrations on PostgreSQL
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/reportingservicedb}
    user: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:Mysql@2022}
  # ---- OAuth2 resource server: verify RS256 JWTs issued by authentication-service ----
  # Keys are pulled from the JWKS endpoint (cached + rotated automatically by Spring);
  # issuer-uri pins the expected `iss` claim so tokens from other realms are rejected.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://auth.paymentprocessor.local}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
  profiles:
    active:
      - local

server:
  port: ${SERVER_PORT:8096}
  shutdown: graceful

# ---- ClickHouse: read-only OLAP replica (owns nothing) ----
analytics:
  clickhouse:
    enabled: ${CLICKHOUSE_ENABLED:false}
    url: ${CLICKHOUSE_URL:jdbc:ch://localhost:8123/analytics}
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
    max-pool-size: 8
    query-timeout-seconds: 60
    max-result-rows: 1000000
  storage:
    backend: ${STORAGE_BACKEND:local}          # local | s3
    local-dir: ${STORAGE_LOCAL_DIR:/tmp/analytics-reports}
    s3:
      bucket: ${STORAGE_S3_BUCKET:analytics-reports}
      region: ${AWS_REGION:us-east-1}
      endpoint: ${STORAGE_S3_ENDPOINT:}         # set for MinIO; empty for real AWS
      presign-ttl-minutes: 60
  reports:
    executor:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 200
    retention-days: 30
    max-concurrent-per-merchant: 5
  notifications:
    kafka-topic: ${REPORT_EVENTS_TOPIC:reportingservicetopic}
    email:
      enabled: ${EMAIL_ENABLED:true}
      from: ${EMAIL_FROM:reports@paymentprocessor.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false

# Toggle: lets local/dev runs and the seeded sample data be exercised without a token.
security:
  jwt:
    enabled: ${SECURITY_JWT_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.paymentprocessor.analytics: INFO

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed

# Local profile only: run the seeded report jobs / Swagger UI without a bearer token.
# Production and every shared environment leave this at the default (true).
security:
  jwt:
    enabled: false
