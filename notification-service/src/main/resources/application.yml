spring:
  application:
    name: notification-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1500
        multiplier: 1.5
        max-interval: 3000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notificationservicedb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Mysql@2022}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:notification-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: MANUAL
  # OAuth2 resource server. Access tokens are minted by authentication-service
  # (social / password login) and signed RS256; we verify them locally against its
  # published JWK set, so no network call to the auth service is needed per request.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://auth.paymentprocessor.local}
  profiles:
    active: local

server:
  port: ${SERVER_PORT:8094}

# --- Inbound platform events consumed from Kafka -----------------------------
events:
  kafka:
    enabled: ${EVENTS_KAFKA_ENABLED:true}
    merchant-events-topic: ${MERCHANT_EVENTS_TOPIC:merchantservicetopic}

# --- Dispatcher (see DispatcherProperties) ----------------------------------
notification:
  dispatcher:
    batch-size: 200
    poll-interval: 2s
    claim-visibility: 2m
    request-timeout: 10s
    backoff-schedule: 5s,30s,2m,10m,1h,6h,24h
    auto-disable-threshold: 15

  # --- Retention (see RetentionProperties) ------------------------------------
  retention:
    retention-days: 90
    months-ahead-to-create: 2

  # --- Internal auth (see SecurityProperties) ---------------------------------
  security:
    internal-api-key: ${INTERNAL_API_KEY:}

  # --- Outbound providers (see ProviderProperties) ----------------------------
  providers:
    sendgrid:
      api-key: ${SENDGRID_API_KEY:}
      from-email: ${SENDGRID_FROM_EMAIL:notifications@example.com}
      from-name: ${SENDGRID_FROM_NAME:Notifications}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}

  # KMS-backed webhook signing secrets. Local/dev default resolves secret_ref
  # via env vars (see EnvSecretResolver); point at real KMS in production.
  secrets:
    provider: ${SECRETS_PROVIDER:env}

# --- Ops ---------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Toggle: lets local/dev runs and the seeded sample data be exercised without a token.
security:
  jwt:
    enabled: ${SECURITY_JWT_ENABLED:true}

---
# Local/dev only: also run the db/seed migrations (sample template, webhook endpoint,
# and message) after db/migration. Activate with SPRING_PROFILES_ACTIVE=local. Never
# enabled by default, so seed data never applies to a production database.
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed

# Local/dev runs are exercised against seeded sample data with plain curl, so the
# JWT resource-server chain is swapped for a permit-all chain here (never in prod).
security:
  jwt:
    enabled: false
