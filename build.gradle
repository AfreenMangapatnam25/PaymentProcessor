plugins {
    id 'java'
}

allprojects {
    group = 'com.paymentprocessor'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    // Run services via bootRun / IDE — do not produce jar or bootJar artifacts.
    tasks.named('jar') {
        enabled = false
    }

    pluginManager.withPlugin('org.springframework.boot') {
        tasks.named('bootJar') {
            enabled = false
        }
    }
}

tasks.named('jar') {
    enabled = false
}
