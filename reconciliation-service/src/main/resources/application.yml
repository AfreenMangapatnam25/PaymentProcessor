spring:
  application:
    name: reconciliation-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reconciliation}
    username: ${DB_USERNAME:recon}
    password: ${DB_PASSWORD:recon}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      pool-name: recon-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

recon:
  matching:
    amount-tolerance: 0.01          # absolute currency-unit tolerance for exact-ish match
    amount-tolerance-percent: 0.5   # percentage tolerance for FX transactions
    date-tolerance-days: 1          # business-day window for date matching
    fx-variance-percent: 0.5        # threshold below which a variance is treated as FX rounding
    auto-correct-confidence: 0.95   # minimum confidence for auto-correction
  severity:
    materiality-weight: 0.0005      # weight applied to amount
    aging-weight: 2.0               # weight applied to age in days
  events:
    topic:
      reconciliation-completed: reconciliation.completed
      mismatch-detected: reconciliation.mismatch-detected

kafka:
  enabled: ${KAFKA_ENABLED:true}

topics:
  reconciliation-completed: reconciliation.completed
  mismatch-detected: reconciliation.mismatch-detected
